<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deeo Miners</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Deeo Miners game"></canvas>
<div id="touch">
  <div class="pad">
    <button data-act="up" class="u">▲</button>
    <button data-act="left" class="l">◀</button>
    <button data-act="right" class="r">▶</button>
    <button data-act="down" class="d">▼</button>
  </div>
  <div class="acts">
    <button data-act="rope">Rope</button>
    <button data-act="bomb">TNT</button>
    <button data-act="pick">Pick</button>
    <button data-act="jump">Jump</button>
  </div>
</div>
<script src="src/level.js"></script>
<script src="src/sprites.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
</body>
</html>
